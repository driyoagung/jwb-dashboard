<div class="card p-6">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="text-sm font-medium text-muted-foreground">{{title}}</h3>
      <p class="mt-2 text-2xl font-semibold tracking-tight tabular-nums">{{value}}</p>
    </div>
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg {{tile}}"><svg class="h-5 w-5" aria-hidden="true"><use href="#i-{{icon}}"/></svg></span>
  </div>
  <p class="mt-3 flex items-center gap-2 text-xs">
    <span class="badge badge-{{dtone}}"><svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#i-trend-{{dir}}"/></svg>{{delta}}</span>
    <span class="text-muted-foreground">{{note||dari bulan lalu}}</span>
  </p>
  {{#if spark}}<div class="mt-4" data-chart="spark" data-kind="area" data-color="{{dtone}}" data-values="{{spark}}" data-height="36"></div>{{/if}}
</div>
