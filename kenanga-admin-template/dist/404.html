<script>
  /* Terapkan preferensi tersimpan sebelum render agar tidak berkedip */
  (function () {
    try {
      var d = document.documentElement, g = function (k) { return localStorage.getItem(k); };
      var t = g('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t;
      var a = g('accent'); if (a && a !== 'indigo') d.dataset.accent = a;
      var r = g('radius'); if (r) d.style.setProperty('--radius', r + 'rem');
      if (g('sbmode') === 'mini') d.dataset.sbmode = 'mini';
    } catch (e) {}
  })();
</script>

<style>

     DESIGN TOKENS

  :root[data-accent="pink"]    { --p-light: 333 71% 51%; --pf-light: 0 0% 100%;   --p-dark: 330 81% 60%; --pf-dark: 0 0% 100%;   --soft-light: 327 73% 97%;  --soft-dark: 333 35% 18%; --sf-light: 336 80% 40%; --sf-dark: 327 87% 82%; }
  :root[data-accent="rose"]    { --p-light: 346 77% 50%; --pf-light: 0 0% 100%;   --p-dark: 349 89% 62%; --pf-dark: 0 0% 100%;   --soft-light: 355 100% 97%; --soft-dark: 346 35% 18%; --sf-light: 346 77% 40%; --sf-dark: 351 95% 84%; }
  :root[data-accent="orange"]  { --p-light: 17 88% 40%;  --pf-light: 0 0% 100%;   --p-dark: 25 95% 53%;  --pf-dark: 20 30% 8%;   --soft-light: 33 100% 96%;  --soft-dark: 21 40% 16%;  --sf-light: 17 88% 40%; --sf-dark: 31 97% 72%; }

  :root[data-accent="emerald"] { --p-light: 161 94% 30%; --pf-light: 0 0% 100%;   --p-dark: 158 64% 52%; --pf-dark: 160 84% 8%;  --soft-light: 152 81% 96%;  --soft-dark: 160 40% 14%; --sf-light: 161 94% 24%; --sf-dark: 156 72% 74%; }
  :root[data-accent="teal"]    { --p-light: 175 84% 32%; --pf-light: 0 0% 100%;   --p-dark: 173 70% 48%; --pf-dark: 175 80% 8%;  --soft-light: 166 76% 96%;  --soft-dark: 175 40% 14%; --sf-light: 175 84% 24%; --sf-dark: 171 77% 74%; }

  /* Tema terang: netral kebiruan, kartu putih di atas latar abu sangat muda */
  :root {
    color-scheme: light;
    --background: 220 25% 97%; --foreground: 224 30% 10%; --card: 0 0% 100%;
    --muted: 220 16% 94%; --muted-foreground: 220 9% 42%; --accent: 220 18% 95%; --border: 220 14% 90%;
    --sidebar: 0 0% 100%;
    --primary: var(--p-light); --primary-foreground: var(--pf-light);

    --chart-1: var(--p-dark); --chart-2: 173 58% 50%; --chart-3: 43 96% 58%; --chart-4: 330 81% 66%; --chart-5: 199 89% 60%;

  /* =====================================================
     LAYOUT SHELL
     ===================================================== */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: hsl(var(--background));
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); -webkit-font-smoothing: antialiased; }

  #sidebar {
    transform: translateX(-100%);
    transition: transform .2s ease, width .15s ease;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body[data-sidebar="open"] #sidebar { transform: none; }
  #overlay { display: none; }
  body[data-sidebar="open"] #overlay { display: block; }
  .app-header { top: env(safe-area-inset-top, 0px); }

  @media (min-width: 1024px) {
    #main { padding-left: 16rem; transition: padding .2s ease; }
    body[data-sidebar="open"] #overlay { display: none; }
    /* Sidebar mode ikon: menyempit ke 4rem dan melebar saat di-hover */
    html[data-sbmode="mini"] #sidebar { width: 4rem; }
    html[data-sbmode="mini"] #sidebar:hover { width: 16rem; }
    html[data-sbmode="mini"] #sidebar:not(:hover) .sb-label { display: none; }
    html[data-sbmode="mini"] #main { padding-left: 4rem; }
    body[data-sidebar="closed"] #main,
    html[data-sbmode="mini"] body[data-sidebar="closed"] #main { padding-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #sidebar, #main { transition: none; } }

  /* Halaman tanpa shell (login, 404) saat dipratinjau dalam satu file */
  body[data-layout="blank"] #sidebar,
  body[data-layout="blank"] #overlay,
  body[data-layout="blank"] .app-header,
  body[data-layout="blank"] .app-footer { display: none; }
  body[data-layout="blank"] #main { padding-left: 0; }
  body[data-layout="blank"] #page-root { max-width: none; padding: 0; margin: 0; }

  /* Tooltip tanpa JS: <button data-tip="Teks"> */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; z-index: 60;
    background: hsl(var(--foreground)); color: hsl(var(--background)); opacity: 0; pointer-events: none; transition: opacity .12s;

  dialog::backdrop { background: rgb(0 0 0 / .5); }

    .drawer { @apply m-0 ml-auto h-full max-h-full w-96 max-w-full rounded-none border-y-0 border-r-0 bg-card p-0 text-foreground shadow-xl backdrop:bg-black/50; }

    /* ---------- Navigasi ---------- */
    .tabs-underline { @apply flex gap-1 overflow-x-auto border-b; }
    .tabs-underline .tab { @apply -mb-px inline-flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50 aria-selected:border-primary aria-selected:text-foreground; }
    .tabs-pill { @apply inline-flex gap-1 rounded-lg bg-muted p-1; }
    .tabs-pill .tab { @apply inline-flex items-center gap-2 whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50 aria-selected:bg-card aria-selected:text-foreground aria-selected:shadow-sm; }
    .tabs-soft { @apply flex gap-1; }
    .tabs-soft .tab { @apply inline-flex items-center gap-2 whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50 aria-selected:bg-soft aria-selected:text-soft-foreground; }
    .tab-count { @apply rounded-full bg-muted px-1.5 text-xs tabular-nums; }
    .menu { @apply fixed z-50 min-w-[12rem] rounded-lg border bg-card p-1 text-sm text-foreground shadow-lg; }
    .menu-item { @apply flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left transition-colors hover:bg-accent focus-visible:bg-accent focus-visible:outline-none; }
    .menu-item-danger { @apply text-danger; }
    .menu-label { @apply px-2 py-1.5 text-xs font-medium text-muted-foreground; }
    .menu-sep { @apply -mx-1 my-1 h-px bg-border; }
    .accordion { @apply divide-y rounded-lg border bg-card; }
    .accordion summary { @apply flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 text-sm font-medium hover:bg-accent/60; }
    .accordion summary::-webkit-details-marker { display: none; }
    .accordion details[open] > summary svg { @apply rotate-180; }
    .accordion details > div { @apply px-4 pb-4 text-sm text-muted-foreground; }
    .step { @apply flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 text-sm font-medium; }
    .step-done { @apply border-primary bg-primary text-primary-foreground; }
    .step-current { @apply border-primary text-primary; }
    .step-todo { @apply text-muted-foreground; }

    /* ---------- Sidebar ---------- */
    .nav-link { @apply flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50; }
    .nav-link[aria-current='page'], .nav-link[aria-current='page']:hover { @apply bg-soft font-medium text-soft-foreground; }
    .nav-link[aria-expanded='true'] .nav-chevron { @apply rotate-90; }
    .nav-sub { @apply ml-4 mt-0.5 space-y-0.5 border-l pl-2; }
    .nav-sub .nav-link { @apply py-1 text-[13px]; }

    /* ---------- Customizer ---------- */
    .pref-btn { @apply flex items-center justify-center gap-2 rounded-md border bg-card px-3 py-2 text-sm font-medium transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/50 aria-pressed:border-primary aria-pressed:ring-2 aria-pressed:ring-primary/30; }
    .swatch { @apply h-8 w-8 rounded-full ring-1 ring-border focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-foreground aria-pressed:ring-2 aria-pressed:ring-foreground aria-pressed:ring-offset-2 aria-pressed:ring-offset-card; }
  }
</style>
